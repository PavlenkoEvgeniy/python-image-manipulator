name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            package: false
          - os: ubuntu-latest
            python-version: '3.14'
            package: true
          - os: windows-latest
            python-version: '3.14'
            package: true
          - os: macos-latest
            python-version: '3.14'
            package: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dnd,multimonitor]"

      - name: Run Ruff
        run: |
          ruff check src tests tools main.py --output-format=github
          ruff format --check src tests tools main.py

      - name: Run mypy
        run: mypy src

      - name: Run vulture
        run: vulture src tests --min-confidence 80

      - name: Run codespell
        run: codespell src tests tools README.md CLAUDE.md GLOSSARY.md --skip="*.json,*.png,*.ico,*.icns"

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -v

      - name: Check package metadata
        if: runner.os == 'Linux' && matrix.package
        run: |
          python -m build --outdir /tmp/package-dist
          twine check /tmp/package-dist/*

      - name: Install PyInstaller
        if: matrix.package
        run: pip install pyinstaller

      - name: Read version
        id: version
        if: matrix.package
        shell: bash
        run: echo "value=$(python -c 'from image_manipulator import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && matrix.package
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Linux packages
        if: runner.os == 'Linux' && matrix.package
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          pyinstaller --onefile --windowed --icon=assets/icon.png \
            --collect-data=image_manipulator \
            --hidden-import=PIL._tkinter_finder \
            --hidden-import=PIL._imagingtk \
            --hidden-import=tkinterdnd2 \
            --hidden-import=screeninfo \
            --name ImageManipulator-linux main.py
          bash packaging/linux/build_packages.sh \
            "${{ steps.version.outputs.value }}" \
            "dist/ImageManipulator-linux" \
            "dist/installers"

      - name: Install Inno Setup
        if: runner.os == 'Windows' && matrix.package
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows' && matrix.package
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          pyinstaller --onefile --windowed --icon=assets/icon.ico `
            --collect-data=image_manipulator `
            --hidden-import=PIL._tkinter_finder `
            --hidden-import=PIL._imagingtk `
            --hidden-import=tkinterdnd2 `
            --hidden-import=screeninfo `
            --name ImageManipulator-windows main.py
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DRepoRoot=$env:GITHUB_WORKSPACE" "/DSourceExe=$env:GITHUB_WORKSPACE\dist\ImageManipulator-windows.exe" "/DOutputDir=$env:GITHUB_WORKSPACE\dist\installers" "packaging\windows\image-manipulator.iss"

      - name: Build macOS disk image
        if: runner.os == 'macOS' && matrix.package
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          pyinstaller --onefile --windowed --icon=assets/icon.icns \
            --collect-data=image_manipulator \
            --hidden-import=PIL._tkinter_finder \
            --hidden-import=PIL._imagingtk \
            --hidden-import=tkinterdnd2 \
            --hidden-import=screeninfo \
            --name "Image Manipulator" main.py
          mkdir -p dist/dmg dist/installers
          cp -R "dist/Image Manipulator.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Image Manipulator" \
            -srcfolder dist/dmg -ov -format UDZO \
            "dist/installers/ImageManipulator-${{ steps.version.outputs.value }}-macos.dmg"

      - name: Upload installers
        if: matrix.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ImageManipulator-${{ runner.os }}
          path: dist/installers/*
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: |
            artifacts/ImageManipulator-Linux/*.deb
            artifacts/ImageManipulator-Linux/*.rpm
            artifacts/ImageManipulator-Windows/*setup.exe
            artifacts/ImageManipulator-macOS/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
