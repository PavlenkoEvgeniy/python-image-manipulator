[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-manipulator"
dynamic = ["version"]
description = "Resize images and overlay text in a single pass"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Pavlenko Evgeniy", email = "pavlenkoevgeniy85@gmail.com"}
]
keywords = ["image", "resize", "text", "overlay", "batch", "tkinter", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/PavlenkoEvgeniy/python-image-manipulator"
Repository = "https://github.com/PavlenkoEvgeniy/python-image-manipulator"
Issues = "https://github.com/PavlenkoEvgeniy/python-image-manipulator/issues"
Releases = "https://github.com/PavlenkoEvgeniy/python-image-manipulator/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "vulture>=2.11.0",
    "pre-commit>=3.7.0",
    "codespell>=2.2.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
dnd = [
    "tkinterdnd2>=0.3.0",
]
multimonitor = [
    "screeninfo>=0.8.0",
]

[project.scripts]
image-manipulator = "image_manipulator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "image_manipulator.__version__"}

[tool.setuptools.package-data]
image_manipulator = ["icon.png", "locales/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PERF", "RUF", "S", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.11"
files = ["src/image_manipulator"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tkinterdnd2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "image_manipulator.config",
    "image_manipulator.i18n",
    "image_manipulator.icon",
    "image_manipulator.logging_config",
    "image_manipulator.pipeline",
    "image_manipulator.positioning",
    "image_manipulator.resize",
    "image_manipulator.settings_store",
    "image_manipulator.text_overlay",
    "image_manipulator.update_checker",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=image_manipulator --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["image_manipulator"]
branch = true
omit = ["*/tests/*", "*/test_*.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
